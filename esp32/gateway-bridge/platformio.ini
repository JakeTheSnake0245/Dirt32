; Dirt32 gateway radio bridge — Heltec WiFi LoRa 32 V4 on the Pi's USB port.
;
; Dumb radio <-> serial bridge: NO keys, NO crypto. Receives LoRa frames and
; emits them as hex lines; transmits hex lines handed to it (gateway ACKs).
; All trust decisions happen on the Linux side.
;
; Build:   pio run
; Flash:   pio run -t upload
[platformio]
default_envs = heltec_v4

[env:heltec_v4]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
build_flags =
    -std=gnu++17
    ; ESP32-S3 native USB — required for Serial over the USB-C port
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLORA_NSS=8
    -DLORA_DIO1=14
    -DLORA_RST=12
    -DLORA_BUSY=13
lib_deps =
    jgromes/RadioLib@^6.6.0
; shared libs (oled_raw status screen driver)
lib_extra_dirs =
    ../lib
