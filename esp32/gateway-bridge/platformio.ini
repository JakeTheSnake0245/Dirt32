; Dirt32 gateway radio bridge — Heltec WiFi LoRa 32 V4 on the Pi's USB port.
;
; Dumb radio <-> serial bridge: NO keys, NO crypto. Receives LoRa frames and
; emits them as hex lines; transmits hex lines handed to it (gateway ACKs).
; All trust decisions happen on the Linux side.
;
; Build:   pio run
; Flash:   pio run -t upload
[platformio]
default_envs = heltec_v4

[env:heltec_v4]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DLORA_NSS=8
    -DLORA_DIO1=14
    -DLORA_RST=12
    -DLORA_BUSY=13
lib_deps =
    jgromes/RadioLib@^6.6.0
