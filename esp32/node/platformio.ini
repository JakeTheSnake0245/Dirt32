; Sensor node firmware — Heltec WiFi LoRa 32 V4 (ESP32-S3 + SX1262, US915)
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor -b 115200
[platformio]
default_envs = heltec_v4

[env:heltec_v4]
platform = espressif32
; True V4 board definition (project-local: boards/heltec_wifi_lora_32_V4.json,
; variant pins from Heltec's official core: variants/heltec_wifi_lora_32_V4/).
; CRITICAL: V4 uses flash_mode=dio + 4MB flash. The V3 board def used qio/8MB —
; QIO claims GPIO38 (FSPIWP) for the flash WP line, clamping GNSS_RX LOW.
board = heltec_wifi_lora_32_V4
board_build.variants_dir = variants
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
build_flags =
    -std=gnu++17
    ; ESP32-S3 native USB — required for Serial over the USB-C port
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSPS_FW_VERSION=1
    ; Heltec V4 SX1262 pin map (verify against your board silk/schematic)
    -DLORA_NSS=8
    -DLORA_DIO1=14
    -DLORA_RST=12
    -DLORA_BUSY=13
    ; Ve sensor power rail (spec §5.2 — VERIFY polarity per board, §12)
    -DPIN_VE=36
    ; Sensor SPI bus is SHARED with the LoRa radio: SCK=9 MISO=11 MOSI=10.
    ; CRITICAL: SPI.begin() must be called with explicit pins (see setup()).
    ; Without explicit pins, SPI claims GPIO38 (FSPIWP) as QSPI WP and drives
    ; it LOW, making UART RX on GPIO38 (GNSS_RX) permanently deaf.
    ; Each sensor gets its own CS.
    ; NOTE: GPIO 2/5/7/46 are used internally by the V4's RF front-end
    ; amplifier — never assign them to sensors.
    ; ADXL355 wiring (SPI)
    ; NOTE: GPIO 26-32 are wired to the flash/PSRAM on the ESP32-S3 —
    ; touching them crashes the chip (TG1WDT boot loop). Never use them.
    -DPIN_ADXL_CS=47
    -DPIN_ADXL_INT1=6
    ; ADS1220 wiring (SPI, shares bus)
    -DPIN_ADS_CS=48
    -DPIN_ADS_DRDY=4
    ; Battery ADC divider input
    -DPIN_VBAT=1
    ; PRG/USER button (active-low) — shows the debug screen
    -DPIN_BUTTON=0
    ; L76K GNSS plug-in module (Heltec V4 GNSS port)
    -DPIN_GPS_RX=38
    -DPIN_GPS_TX=39
    -DPIN_GPS_EN=34
    -DPIN_GPS_STANDBY=40
    -DPIN_GPS_RESET=42
lib_deps =
    jgromes/RadioLib@^6.6.0
    bblanchon/ArduinoJson@^7.0.0
; Shared protocol library is symlinked/copied from ../lib/sps_proto via lib_extra_dirs
lib_extra_dirs =
    ../lib
