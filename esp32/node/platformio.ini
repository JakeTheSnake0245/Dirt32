; Sensor node firmware — Heltec WiFi LoRa 32 V4 (ESP32-S3 + SX1262, US915)
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor -b 115200
[platformio]
default_envs = heltec_v4

[env:heltec_v4]
platform = espressif32
; True V4 board definition (project-local: boards/heltec_wifi_lora_32_V4.json,
; variant pins from Heltec's official core: variants/heltec_wifi_lora_32_V4/).
; CRITICAL: V4 uses flash_mode=dio + 4MB flash. The V3 board def used qio/8MB —
; QIO claims GPIO38 (FSPIWP) for the flash WP line, clamping GNSS_RX LOW.
board = heltec_wifi_lora_32_V4
board_build.variants_dir = variants
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
build_flags =
    -std=gnu++17
    ; ESP32-S3 native USB — required for Serial over the USB-C port
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSPS_FW_VERSION=1
    ; Heltec V4 SX1262 pin map (verify against your board silk/schematic)
    -DLORA_NSS=8
    -DLORA_DIO1=14
    -DLORA_RST=12
    -DLORA_BUSY=13
    ; Ve sensor power rail (spec §5.2 — VERIFY polarity per board, §12)
    -DPIN_VE=36
    ; Sensor SPI bus — DEDICATED, on header-exposed pins.
    ; CRITICAL (V4): the LoRa radio's SPI (SCK=9/MOSI=10/MISO=11) is routed
    ; internally to the SX1262 and is NOT on any header (datasheet J2/J3
    ; tables) — sensors can NOT share it. They get their own SPI peripheral:
    ;   SCK  = GPIO48 (J2 pin 14)
    ;   MISO = GPIO4  (J3 pin 15)
    ;   MOSI = GPIO45 (J3 pin 6)  — strapping pin: fine as a data line
    ;                               (sensor unpowered at reset); do NOT add
    ;                               a strong external pull to it.
    ; The radio keeps the default SPI bus with explicit pins 9/11/10 (see
    ; setup()) — without explicit pins, SPI claims GPIO38 (FSPIWP) and
    ; drives it LOW, making UART RX on GPIO38 (GNSS_RX) permanently deaf.
    ; NOTE: GPIO 2/7 are the V4 RF front-end amp controls (FEM_EN /
    ; VFEM_Control) — never assign them to sensors.
    -DPIN_SENS_SCK=48
    -DPIN_SENS_MISO=4
    -DPIN_SENS_MOSI=45
    ; ADXL355 wiring (SPI): CS on J2 pin 13, INT1 on J3 pin 17
    -DPIN_ADXL_CS=47
    -DPIN_ADXL_INT1=6
    ; ADS1220 wiring (SPI, shares the sensor bus). Old CS=48/DRDY=4 became
    ; the bus itself. CS=46 (J3 pin 5) and DRDY=3 (J3 pin 14) are strapping
    ; pins: safe here (CS idles HIGH after boot, DRDY is input-only), but
    ; do not add strong external pulls to either.
    -DPIN_ADS_CS=46
    -DPIN_ADS_DRDY=3
    ; Battery ADC divider input
    -DPIN_VBAT=1
    ; PRG/USER button (active-low) — shows the debug screen
    -DPIN_BUTTON=0
    ; L76K GNSS plug-in module (Heltec V4 GNSS port)
    ; RX=39/TX=38 per Heltec's official V4 GPS example (NOT 38/39):
    ; Serial1.begin(9600, SERIAL_8N1, 39, 38) in LoRaWanGPSTime_lora_v4.ino
    -DPIN_GPS_RX=39
    -DPIN_GPS_TX=38
    -DPIN_GPS_EN=34
    -DPIN_GPS_RESET=42
lib_deps =
    jgromes/RadioLib@^6.6.0
    bblanchon/ArduinoJson@^7.0.0
; Shared protocol library is symlinked/copied from ../lib/sps_proto via lib_extra_dirs
lib_extra_dirs =
    ../lib
