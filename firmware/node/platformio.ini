; Sensor node firmware — Heltec WiFi LoRa 32 V4 (ESP32-S3 + SX1262, US915)
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor -b 115200
[platformio]
default_envs = heltec_v4

[env:heltec_v4]
platform = espressif32
; Heltec V4 is ESP32-S3 based; the V3 board def shares the S3 target and pinmap
; for LoRa/OLED. If your platform version ships heltec_wifi_lora_32_V4, use it.
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DSPS_FW_VERSION=1
    ; Heltec V4 SX1262 pin map (verify against your board silk/schematic)
    -DLORA_NSS=8
    -DLORA_DIO1=14
    -DLORA_RST=12
    -DLORA_BUSY=13
    ; Ve sensor power rail (spec §5.2 — VERIFY polarity per board, §12)
    -DPIN_VE=36
    ; ADXL355 wiring (SPI) — adjust to your harness
    -DPIN_ADXL_CS=5
    -DPIN_ADXL_INT1=6
    ; ADS1220 wiring (SPI, shares bus) — adjust to your harness
    -DPIN_ADS_CS=7
    -DPIN_ADS_DRDY=4
    ; Battery ADC divider input
    -DPIN_VBAT=1
lib_deps =
    jgromes/RadioLib@^6.6.0
    bblanchon/ArduinoJson@^7.0.0
; Shared protocol library is symlinked/copied from ../lib/sps_proto via lib_extra_dirs
lib_extra_dirs =
    ../lib
