<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dirt32 — Perimeter</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0b0e11; --panel: #12161b; --edge: #1f2730;
    --text: #c9d4dd; --dim: #66727e;
    --green: #2ecc71; --yellow: #f1c40f; --red: #e74c3c; --cyan: #3dd6d0;
    font-family: "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); height: 100vh;
         display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--edge);
           display: flex; align-items: baseline; gap: 16px; }
  header h1 { font-size: 15px; letter-spacing: 3px; color: #e8eef3; }
  header .sub { color: var(--dim); font-size: 11px; }
  #counts { margin-left: auto; font-size: 12px; display: flex; gap: 14px; }
  .dotlbl::before { content: "●"; margin-right: 5px; }
  .g::before { color: var(--green); } .y::before { color: var(--yellow); }
  .r::before { color: var(--red); }
  main { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1; background: #0b0e11; }
  aside { width: 340px; border-left: 1px solid var(--edge); display: flex;
          flex-direction: column; min-height: 0; }
  aside h2 { font-size: 11px; letter-spacing: 2px; color: var(--dim);
             padding: 10px 14px 6px; text-transform: uppercase; }
  #nodes { overflow-y: auto; border-bottom: 1px solid var(--edge);
           max-height: 45%; }
  .node { padding: 8px 14px; border-bottom: 1px solid #151b21; cursor: pointer;
          font-size: 12px; }
  .node:hover { background: var(--panel); }
  .node .st::before { content: "●"; margin-right: 7px; }
  .node .meta { color: var(--dim); font-size: 11px; margin-top: 2px; }
  #feed { flex: 1; overflow-y: auto; }
  .ev { padding: 7px 14px; font-size: 11.5px; border-bottom: 1px solid #151b21; }
  .ev .t { color: var(--dim); margin-right: 8px; }
  .ev.alert { border-left: 3px solid var(--red); background: #16100f; }
  .ev.alert.wifi { border-left: 3px solid var(--cyan); background: #0d1418; }
  .csi { color: var(--cyan); }
  button.recal { background: none; border: 1px solid var(--cyan);
    color: var(--cyan); font: inherit; font-size: 11px; cursor: pointer;
    padding: 0 6px; border-radius: 3px; vertical-align: middle; }
  button.recal:disabled { opacity: 0.5; cursor: default; }
  button.gear { border-color: var(--dim, #667); color: var(--dim, #889); }
  .settings { margin: 6px 0 2px; padding: 6px 8px; border-left: 2px solid #345; }
  .setrow { display: flex; gap: 6px; align-items: center; margin: 3px 0; }
  .setrow label { flex: 1; font-size: 11px; opacity: 0.8; }
  .setrow input { width: 70px; background: #10161d; color: inherit;
    border: 1px solid #345; border-radius: 3px; font: inherit; font-size: 11px;
    padding: 1px 4px; }
  .setrow button { background: none; border: 1px solid var(--cyan);
    color: var(--cyan); font: inherit; font-size: 11px; cursor: pointer;
    padding: 0 6px; border-radius: 3px; }
  .sethint { font-size: 10px; opacity: 0.5; margin-top: 4px; }
  .ev.heartbeat { border-left: 3px solid #223042; }
  .ev.status { border-left: 3px solid #2a2a1a; color: var(--dim); }
  .leaflet-container { font: inherit; }
  .leaflet-tile { filter: grayscale(1) invert(1) brightness(0.7) contrast(1.2); }
  .pulse { animation: pulse 1.2s ease-out infinite; }
  @keyframes pulse { 0% { opacity: .9 } 50% { opacity: .3 } 100% { opacity: .9 } }
  #offline { position: absolute; top: 70px; right: 360px; z-index: 1000;
             background: #3a1418; color: #ffb3b3; padding: 6px 12px;
             font-size: 12px; border: 1px solid #6b2229; display: none; }
</style>
</head>
<body>
<header>
  <h1>DIRT32</h1>
  <span class="sub">perimeter status</span>
  <div id="counts">
    <span class="dotlbl g" id="cg">0</span>
    <span class="dotlbl y" id="cy">0</span>
    <span class="dotlbl r" id="cr">0</span>
  </div>
</header>
<div id="offline">gateway unreachable</div>
<main>
  <div id="map"></div>
  <aside>
    <h2>Sensors</h2>
    <div id="nodes"></div>
    <h2>Live feed</h2>
    <div id="feed"></div>
  </aside>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORS = { green: "#2ecc71", yellow: "#f1c40f", red: "#e74c3c" };
const base = location.pathname.replace(/\/$/, "");
const api = p => fetch(base + p).then(r => r.json());

const map = L.map("map", { zoomControl: false, attributionControl: false });
L.control.zoom({ position: "bottomleft" }).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            { maxZoom: 19 }).addTo(map);
map.setView([40.0176, -105.2797], 15);

const markers = {};   // node_id -> circleMarker
let fitted = false, lastEvt = 0;

function fmtAgo(ts) {
  if (!ts) return "never";
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 90) return Math.round(s) + "s ago";
  if (s < 5400) return Math.round(s / 60) + "m ago";
  return (s / 3600).toFixed(1) + "h ago";
}

function renderNodes(nodes) {
  const counts = { green: 0, yellow: 0, red: 0 };
  const list = document.getElementById("nodes");
  list.innerHTML = "";
  const pts = [];
  for (const n of nodes) {
    counts[n.color] = (counts[n.color] || 0) + 1;
    const hasPos = n.lat !== null && n.lat !== undefined
                && n.lon !== null && n.lon !== undefined;
    if (hasPos) {
      pts.push([n.lat, n.lon]);
      if (!markers[n.node_id]) {
        markers[n.node_id] = L.circleMarker([n.lat, n.lon], {
          radius: 9, weight: 2, fillOpacity: 0.85 }).addTo(map);
      }
      const m = markers[n.node_id];
      m.setLatLng([n.lat, n.lon]);
      m.setStyle({ color: COLORS[n.color], fillColor: COLORS[n.color] });
      if (n.color === "red") m._path.classList.add("pulse");
      else m._path.classList.remove("pulse");
      const posLabel = n.pos_source === "gps" ? "GPS fix"
                     : n.pos_source === "provisioned" ? "provisioned"
                     : n.pos_source === "fallback" ? "fallback coords" : "";
      const csiLabel = n.csi_on
        ? (n.csi_calibrating ? "wifi radar: calibrating"
           : `wifi radar: on · noise ${((n.csi_noise ?? 0) / 100).toFixed(2)}`)
        : "";
      m.bindTooltip(
        `<b>#${n.node_id}${n.name ? " " + n.name : ""}</b><br>` +
        `${n.reasons.join("<br>")}<br>` +
        `batt ${n.battery_mv ?? "?"} mV · rssi ${n.rssi?.toFixed?.(0) ?? "?"}<br>` +
        `${posLabel ? "pos: " + posLabel + "<br>" : ""}` +
        `${csiLabel ? csiLabel + "<br>" : ""}` +
        `seen ${fmtAgo(n.last_seen)}`, { className: "", sticky: true });
    }
    const div = document.createElement("div");
    div.className = "node";
    const csiMeta = n.csi_on
      ? `<span class="csi"> · ᯤ ${n.csi_calibrating ? "calibrating"
           : "csi " + ((n.csi_noise ?? 0) / 100).toFixed(2)}</span>`
      : "";
    const recalBtn = n.csi_on
      ? ` <button class="recal" data-node="${n.node_id}" title=
"Restart WiFi-radar baseline calibration on this node (keep the area clear ~30s)"
>recal</button>` : "";
    const gearBtn = ` <button class="recal gear" title="node settings">⚙</button>`;
    div.innerHTML =
      `<span class="st" style="color:${COLORS[n.color]}">#${n.node_id}` +
      `${n.name ? " · " + n.name : ""}</span>${recalBtn}${gearBtn}` +
      `<div class="meta">${n.reasons.join(" · ")} — seen ${fmtAgo(n.last_seen)}` +
      `${n.battery_mv ? " · " + n.battery_mv + " mV" : ""}${csiMeta}</div>` +
      `<div class="settings" style="display:none"></div>`;
    if (hasPos) div.onclick = () => map.setView([n.lat, n.lon], 17);
    const btn = div.querySelector("button.recal:not(.gear)");
    if (btn) btn.onclick = async (ev) => {
      ev.stopPropagation();
      btn.disabled = true; btn.textContent = "…";
      const r = await authedPost(`/gw/nodes/${n.node_id}/recal`);
      btn.textContent = r.ok ? "sent ✓" : "failed";
      setTimeout(() => { btn.disabled = false; btn.textContent = "recal"; }, 4000);
    };
    const panel = div.querySelector(".settings");
    if (openSettings.has(n.node_id)) {      // survive the 3s re-render
      buildSettings(panel, n);
      panel.style.display = "block";
    }
    const gear = div.querySelector("button.gear");
    gear.onclick = (ev) => {
      ev.stopPropagation();
      if (panel.style.display === "none") {
        openSettings.add(n.node_id);
        buildSettings(panel, n);
        panel.style.display = "block";
      } else {
        openSettings.delete(n.node_id);
        panel.style.display = "none";
      }
    };
    list.appendChild(div);
  }
  document.getElementById("cg").textContent = counts.green || 0;
  document.getElementById("cy").textContent = counts.yellow || 0;
  document.getElementById("cr").textContent = counts.red || 0;
  if (!fitted && pts.length) {
    map.fitBounds(pts, { padding: [40, 40] });
    fitted = true;
  }
}

async function authedPost(path, body) {
  const post = () => fetch(base + path, {
    method: "POST",
    headers: Object.assign(
      body ? { "Content-Type": "application/json" } : {},
      localStorage.apiToken ? { "X-Api-Token": localStorage.apiToken } : {}),
    body: body ? JSON.stringify(body) : undefined });
  try {
    let resp = await post();
    if (resp.status === 401) {
      const t = prompt("API token (web.api_token in gateway.json):");
      if (t) { localStorage.apiToken = t; resp = await post(); }
    }
    return await resp.json();
  } catch { return { ok: false, error: "network" }; }
}

// Per-node remote settings (sent over LoRa; the node validates, saves to
// flash, and heartbeats back as confirmation).
const openSettings = new Set();          // node ids with panel open
const draftValues = {};                  // "nodeId:param" -> typed value
const SETTINGS = [
  { param: "csi_threshold",      label: "radar sensitivity threshold", step: 0.1,  csi: true,
    hint: "trigger at metric ≥ this; lower = more sensitive (default 2.0)" },
  { param: "csi_holdoff_s",      label: "radar hold-off (s)",          step: 1,    csi: true,
    hint: "quiet time after an event (default 5)" },
  { param: "csi_calib_s",        label: "radar calibration (s)",       step: 5,    csi: true,
    hint: "baseline learning time (default 30)" },
  { param: "csi_ping_hz",        label: "radar ping rate (Hz)",        step: 1,    csi: true,
    hint: "WiFi sensing traffic rate (default 10)" },
  { param: "trigger_ratio",      label: "seismic trigger ratio",       step: 0.1,  csi: false,
    hint: "STA/LTA ratio; lower = more sensitive (default 2.0)" },
  { param: "motion_threshold_g", label: "wake threshold (g)",          step: 0.0005, csi: false,
    hint: "accelerometer wake level; lower = more sensitive (default 0.0025)" },
  { param: "heartbeat_per_day",  label: "heartbeats per day",          step: 1,    csi: false,
    hint: "liveness reports (default 24)" },
];

function buildSettings(panel, n) {
  panel.innerHTML = "";
  panel.onclick = (ev) => ev.stopPropagation();
  for (const s of SETTINGS) {
    if (s.csi && !n.csi_on) continue;
    const row = document.createElement("div");
    row.className = "setrow";
    row.innerHTML =
      `<label title="${s.hint}">${s.label}</label>` +
      `<input type="number" step="${s.step}" placeholder="—">` +
      `<button>set</button>`;
    const inp = row.querySelector("input"), b = row.querySelector("button");
    const dk = `${n.node_id}:${s.param}`;
    if (draftValues[dk] !== undefined) inp.value = draftValues[dk];
    inp.oninput = () => { draftValues[dk] = inp.value; };
    b.onclick = async () => {
      const v = parseFloat(inp.value);
      if (isNaN(v)) { b.textContent = "?"; setTimeout(() => b.textContent = "set", 1500); return; }
      b.disabled = true; b.textContent = "…";
      const r = await authedPost(`/gw/nodes/${n.node_id}/set`,
                                 { param: s.param, value: v });
      b.textContent = r.ok ? "✓" : "✗";
      if (!r.ok && r.error) console.warn("set failed:", r.error);
      setTimeout(() => { b.disabled = false; b.textContent = "set"; }, 3000);
    };
    panel.appendChild(row);
  }
  const note = document.createElement("div");
  note.className = "sethint";
  note.textContent = "sent over LoRa · node saves to flash & heartbeats back";
  panel.appendChild(note);
}

function pushFeed(e) {
  const feed = document.getElementById("feed");
  const div = document.createElement("div");
  div.className = "ev " + e.kind;
  const t = new Date(e.at * 1000).toLocaleTimeString();
  const d = e.data;
  let msg;
  if (e.kind === "alert" && d.channel === "rf") {
    // WiFi radar (CSI) detection — RF channel, distinct styling
    div.className += " wifi";
    msg = `<span class="csi">ᯤ node #${d.node_id} WIFI PRESENCE ` +
          `metric=${((d.peak_amp ?? 0) / 100).toFixed(2)} conf=${d.confidence}</span>`;
  } else if (e.kind === "alert")
    msg = `⚠ node #${d.node_id} ${d.event?.toUpperCase()} conf=${d.confidence}`;
  else if (e.kind === "heartbeat")
    msg = `node #${d.node_id} heartbeat · ${d.battery_mv} mV`;
  else if (e.kind === "cmd")
    msg = `<span class="csi">ᯤ node #${d.node_id} ${d.cmd === 2
          ? "setting sent" : "recalibrate sent"}</span>`;
  else
    msg = `node #${d.node_id} → ${d.color}` +
          (d.reasons?.length ? ` (${d.reasons[0]})` : "");
  div.innerHTML = `<span class="t">${t}</span>${msg}`;
  feed.prepend(div);
  while (feed.children.length > 120) feed.lastChild.remove();
  if (e.kind === "alert" && markers[d.node_id])
    markers[d.node_id].setStyle({ radius: 14 }) &&
      setTimeout(() => markers[d.node_id].setStyle({ radius: 9 }), 1500);
}

async function tick() {
  try {
    const [nodes, evts] = await Promise.all([
      api("/gw/nodes"), api("/gw/events?since=" + lastEvt)]);
    document.getElementById("offline").style.display = "none";
    renderNodes(nodes.nodes);
    for (const e of evts.events) { pushFeed(e); lastEvt = Math.max(lastEvt, e.at); }
    if (!lastEvt) lastEvt = evts.now;
  } catch {
    document.getElementById("offline").style.display = "block";
  }
}
tick();
setInterval(tick, 3000);
</script>
</body>
</html>
